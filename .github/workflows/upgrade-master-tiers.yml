name: Upgrade Master Tiers

# Takes a master-tiers file you provide (upload it as incoming_tiers.csv) and
# incorporates its rankings into a new dated master_tiers.<today>.csv, refreshed
# through the current pipeline (latest stats + any new columns), keeping your
# tiers and prices. The previous master_tiers.*.csv files are kept as a growing
# collection of masters used. If no incoming_tiers.csv is uploaded, it simply
# re-processes the newest master in place.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (ingest + export extras)
        run: pip install -e ".[ingest,export]"

      - name: Build database from nflverse
        run: |
          python -m fantasy_football.cli init-db
          python -m fantasy_football.cli load-seasons --start 2020
          python -m fantasy_football.cli load-active --year 2026
          python -m fantasy_football.cli load-byes --year 2026
          python -m fantasy_football.cli load-redzone
          python -m fantasy_football.cli load-draft --year 2026 --max-round 3
          if [ -f coaching.csv ]; then
            python -m fantasy_football.cli load-coaching --file coaching.csv
          fi

      - name: Incorporate the provided master tiers
        run: |
          PREV=$(ls -1 master_tiers.*.csv 2>/dev/null | sort | tail -1)
          # Prefer an uploaded master-tiers file; else re-process the newest master.
          if [ -f incoming_tiers.csv ]; then SRC=incoming_tiers.csv; else SRC="$PREV"; fi
          if [ -z "$SRC" ]; then
            echo "::error::upload incoming_tiers.csv (or have a master_tiers.*.csv to refresh)"; exit 1
          fi
          OUT="master_tiers.$(date +%F).csv"
          echo "Incorporating $SRC -> $OUT (prices carried from ${PREV:-none}); keeping previous masters"
          python -m fantasy_football.cli import-tiers --file "$SRC" --out "$OUT" \
            ${PREV:+--prices-from "$PREV"}
          # Consume the uploaded file so it isn't re-incorporated next run.
          if [ "$SRC" = incoming_tiers.csv ]; then git rm -q incoming_tiers.csv; fi
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Commit (new master added, previous ones kept as history)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Incorporate master tiers -> $OUT" || echo "no changes to commit"
          git push

      - name: Upload master tiers
        uses: actions/upload-artifact@v4
        with:
          name: master-tiers
          path: ${{ env.OUT }}
          retention-days: 90

