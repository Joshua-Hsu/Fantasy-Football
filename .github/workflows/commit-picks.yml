name: Commit Picks

# Commits a pick export from the Tier Builder app into picks/ without using the
# app's "Commit picks to GitHub" button (which only opens a pre-filled GitHub
# editor and is easily swallowed by popup blockers). Paste the CSV the app
# produces - "key,rating" rows - and this writes it to picks/<filename> and
# pushes it. Then run "Rebuild Master Tiers" to fold it into the next master.
#
# Row separators: real newlines work when triggered via the API / `gh workflow
# run`. From the Actions tab the input box is single-line, so separate rows with
# a semicolon ";" instead - e.g. "key,rating;p00-0034796,310.1;dDEN,138.8".
on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Pick CSV (key,rating rows; use ";" between rows in the web UI)'
        required: true
      filename:
        description: "File name under picks/ (blank = picks-<timestamp>.csv)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write picks file
        env:
          CONTENT: ${{ inputs.content }}
          FNAME: ${{ inputs.filename }}
        run: |
          python - <<'PY'
          import os, datetime, pathlib

          content = os.environ.get("CONTENT", "")
          # Normalize: literal "\n" -> newline; if still one line, treat ";" as
          # the row separator (the Actions UI input is single-line).
          content = content.replace("\\n", "\n").replace("\r", "")
          if "\n" not in content.strip() and ";" in content:
              content = content.replace(";", "\n")
          rows = [ln.strip() for ln in content.splitlines() if ln.strip()]
          # Drop a pasted header; we re-add a canonical one.
          if rows and rows[0].lower().replace(" ", "").startswith("key,"):
              rows = rows[1:]
          if not rows:
              raise SystemExit("::error::No pick rows found in `content` input.")

          bad = [r for r in rows if len(r.split(",")) < 2]
          if bad:
              raise SystemExit(f"::error::These rows aren't `key,rating`: {bad[:5]}")

          name = os.environ.get("FNAME", "").strip()
          if not name:
              ts = datetime.datetime.utcnow().strftime("%Y-%m-%d_%H-%M-%S")
              name = f"picks-{ts}.csv"
          if not name.endswith(".csv"):
              name += ".csv"
          # Keep it inside picks/, ignore any path the user typed.
          name = pathlib.Path(name).name

          out = pathlib.Path("picks") / name
          out.parent.mkdir(exist_ok=True)
          out.write_text("key,rating\n" + "\n".join(rows) + "\n")
          print(f"Wrote {out} ({len(rows)} picks):")
          print(out.read_text())
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PICKS_FILE={out}\n")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PICKS_FILE"
          git commit -m "Add picks: $PICKS_FILE" || { echo "nothing to commit"; exit 0; }
          git push
