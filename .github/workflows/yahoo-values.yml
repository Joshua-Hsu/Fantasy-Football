# Weekly snapshot of Yahoo's salary-cap draft values (projected + current
# average cost). Accumulates yahoo/values.<date>.csv for trend analysis and
# always keeps the raw HTML, so history survives Yahoo markup changes.
# Runs here (not in the web sandbox) because Actions runners have normal
# internet egress; the sandbox's network policy blocks yahoo.com.
name: Yahoo Values Snapshot

on:
  schedule:
    - cron: "0 13 * * 3"   # Wednesdays 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: yahoo-values
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + headless browser
        # Browser kept as a fallback; the primary source is the Fantasy
        # Sports API (the web page locks salcap values behind Fantasy Plus).
        run: |
          pip install -e . playwright
          python -m playwright install --with-deps chromium

      - name: Pull Yahoo salary-cap values
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python -m fantasy_football.cli pull-yahoo --out-dir yahoo --browser

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yahoo
          git commit -m "Yahoo salcap values snapshot $(date -u +%F)" || echo "no changes"
          # rebase-and-retry: another job or a PR merge may have moved main during the run
          pushed=0
          for i in 1 2 3 4; do
            if git pull --rebase origin main; then
              if git push; then pushed=1; break; fi
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git diff --name-only --diff-filter=U | xargs -r git checkout --theirs --
              git add -A && GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep $((i * 5))
          done
          [ "$pushed" = 1 ] || { echo "::error::push failed after 4 attempts"; exit 1; }
