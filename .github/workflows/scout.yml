# Weekly defensive scouting notes via the Gemini API (Google Search grounding).
# Runs Tuesday 13:00 UTC, after the DvP refresh has loaded the box scores, and
# asks one two-defense question per played game of the last completed week.
# Needs the GEMINI_API_KEY repo secret; without it the job exits cleanly and
# the paste-and-verify loop (see .claude/skills/defense-notes) is the path.
# Auto notes are prefixed "auto (Gemini, unverified)" - a pasted, verified
# note for the same team supersedes them on the page (newest wins).
name: Defense Scouting Notes

on:
  schedule:
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to scout (default: last completed)"
        required: false

permissions:
  contents: write

concurrency:
  group: dvp
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "no GEMINI_API_KEY secret - skipping"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install package
        if: steps.key.outputs.ok == 'true'
        run: pip install -e ".[ingest]"

      - name: Load current + baseline seasons
        if: steps.key.outputs.ok == 'true'
        run: |
          python -m fantasy_football.cli init-db
          YEAR=$(date -u +%Y)
          python -m fantasy_football.cli load-season --year $((YEAR - 1))
          python -m fantasy_football.cli load-season --year "$YEAR"

      - name: Scout the week
        if: steps.key.outputs.ok == 'true'
        run: |
          SINCE=$(date -u -d "3 days ago" +%F)
          WEEK_ARG=""
          if [ -n "${{ github.event.inputs.week }}" ]; then WEEK_ARG="--week ${{ github.event.inputs.week }}"; fi
          python -m fantasy_football.cli scout-run --since "$SINCE" $WEEK_ARG
          python -m fantasy_football.cli dvp --out docs/dvp.js
          V=$(date -u +%Y%m%d)
          sed -i -E "s/(dvp\.js\?v=)[0-9]+/\1$V/" docs/index.html

      - name: Commit
        if: steps.key.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add defense_notes.csv docs/dvp.js docs/index.html
          git commit -m "Defense scouting notes $(date -u +%F) (auto)" || echo "no changes"
          git push
