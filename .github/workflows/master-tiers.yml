name: Rebuild Master Tiers

# Merges every pick export sitting in picks/*.csv (committed from the app's
# "Export tiers CSV") into a new dated master_tiers.<today>.csv: ratings are
# averaged across the files, folded onto the previous master so un-picked
# players carry forward, tiers are re-derived, and prices are preserved. Then
# it regenerates the pick-game data (so the app re-seeds from the new master)
# and clears the picks/ inbox. Run the "Archive Week" action FIRST if you want
# to snapshot the master + picks before they're folded in.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (ingest + export extras)
        run: pip install -e ".[ingest,export]"

      - name: Build database from nflverse
        run: |
          python -m fantasy_football.cli init-db
          python -m fantasy_football.cli load-seasons --start 2020
          python -m fantasy_football.cli load-active --year 2026
          python -m fantasy_football.cli load-byes --year 2026
          python -m fantasy_football.cli load-redzone
          python -m fantasy_football.cli load-draft --year 2026 --max-round 3
          if [ -f coaching.csv ]; then
            python -m fantasy_football.cli load-coaching --file coaching.csv
          fi

      - name: Rebuild master from picks
        run: |
          DATE=$(date +%F)
          OUT="master_tiers.${DATE}.csv"
          PREV=$(ls -1 master_tiers.*.csv 2>/dev/null | sort | tail -1)
          PICKS=$(ls -1 picks/*.csv 2>/dev/null || true)
          if [ -n "$PICKS" ]; then
            echo "Merging picks into $OUT (base/prices from ${PREV:-none}):"
            echo "$PICKS"
            python -m fantasy_football.cli import-tiers --file $PICKS --out "$OUT" \
              ${PREV:+--prices-from "$PREV"}
            git rm -q picks/*.csv   # consume the inbox; archive them first if wanted
          elif [ -n "$PREV" ]; then
            echo "No picks/*.csv - refreshing newest master $PREV -> $OUT"
            python -m fantasy_football.cli import-tiers --file "$PREV" --out "$OUT" \
              --prices-from "$PREV"
          else
            echo "::error::no picks/*.csv and no master_tiers.*.csv to rebuild from"; exit 1
          fi
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Regenerate pick-game data (app re-seeds from the new master)
        run: |
          python -m fantasy_football.cli build-webapp --out docs/data.js --tiers-file "$OUT"
          V=$(date +%Y%m%d)
          sed -i -E "s/(data\.js\?v=)[0-9]+/\1$V/; s/(app\.js\?v=)[0-9]+/\1$V/" docs/index.html

      - name: Commit (new master + refreshed app data; inbox cleared)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild master tiers -> $OUT (merge picks)" || echo "no changes to commit"
          git push

      - name: Upload master tiers
        uses: actions/upload-artifact@v4
        with:
          name: master-tiers
          path: ${{ env.OUT }}
          retention-days: 90
