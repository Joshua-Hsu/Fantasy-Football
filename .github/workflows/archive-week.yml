name: Archive Week

# Weekly reset of the user-rankings database. Snapshots the current master tiers
# and every user file in picks/*.csv into archive/<date>/, then REMOVES the pick
# files from picks/ so the next week's "Rebuild Master Tiers" no longer folds in
# last week's rankings - fresh submissions accumulate from empty again. Runs
# automatically once a week (and on demand).
on:
  schedule:
    - cron: "0 9 * * 2"   # Tuesdays 09:00 UTC - after the NFL week wraps up
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot master + picks, then clear the picks inbox
        run: |
          DATE=$(date +%F)
          DEST="archive/${DATE}"
          mkdir -p "$DEST"
          PREV=$(ls -1 master_tiers.*.csv 2>/dev/null | sort | tail -1)
          if [ -n "$PREV" ]; then cp "$PREV" "$DEST/"; echo "archived master: $PREV"; fi
          if ls picks/*.csv >/dev/null 2>&1; then
            N=$(ls picks/*.csv | wc -l)
            cp picks/*.csv "$DEST/"
            git rm -q picks/*.csv          # remove from the inbox so rebuilds drop them
            echo "archived and cleared $N pick file(s)"
          else
            echo "no picks/*.csv to archive"
          fi
          if [ -z "$PREV" ] && [ -z "$(ls "$DEST" 2>/dev/null)" ]; then
            echo "::warning::nothing to archive"; rmdir "$DEST" 2>/dev/null || true
          fi

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Archive week $(date +%F) (master + picks; cleared inbox)" || echo "nothing to archive"
          git push
