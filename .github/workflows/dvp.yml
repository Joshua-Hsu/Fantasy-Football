# Weekly defense-vs-position refresh: reloads the current season's box
# scores from nflverse (plus last season as the early-week baseline) and
# regenerates docs/dvp.js — the Matchups page's data sidecar. Runs Tuesday
# noon UTC (box scores complete) and again Wednesday 06:00 UTC, because the
# snap-count release trails Monday night by a day and the personnel flags
# must be complete before Wednesday-morning waivers. The Wednesday run also
# appends the computed "WkN measured:" defense notes (defense_measured.py).
# Independent of the master-tiers rebuild: matchup data changes every
# week whether or not anyone submitted picks.
name: Defense vs Position

on:
  schedule:
    # Tuesday 12:00 UTC: all 16 box scores are in (stats, lines, ranks).
    # Wednesday 06:00 UTC (2am ET): the snap-count release lags Monday
    # night by about a day, so personnel flags need a second pass - and it
    # lands before Wednesday-morning waivers process (~3:30am ET).
    - cron: "0 12 * * 2"
    - cron: "0 6 * * 3"
    # Saturday 06:00 UTC: Friday's official game designations (Out /
    # Doubtful / Questionable) have landed in nflverse's injuries file.
    # Sunday 14:00 UTC (10am ET): last pass for Saturday downgrades before
    # the early kickoffs. Both are tokenless - the report is a plain CSV.
    - cron: "0 6 * * 6"
    - cron: "0 14 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dvp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[ingest]"

      - name: Load current + baseline seasons
        run: |
          python -m fantasy_football.cli init-db
          YEAR=$(date -u +%Y)
          python -m fantasy_football.cli load-season --year $((YEAR - 1))
          python -m fantasy_football.cli load-season --year "$YEAR" || \
            echo "current season not published yet - baseline only"

      # Measured weekly defense notes (no model): Wednesday's run sees the
      # full snap counts and the FTN charting file. Runs BEFORE the build so
      # the new "WkN measured:" rows land in this dvp.js. --force refreshes
      # a week already written; the default week is the latest one every
      # defense is charted for. Flagged profile shifts go to the job summary.
      - name: Measured defense notes (Wednesday)
        if: github.event.schedule == '0 6 * * 3' || github.event_name == 'workflow_dispatch'
        run: |
          python -m fantasy_football.cli defense-notes-measured --year "$(date -u +%Y)" --force \
            | tee measured.log
          { echo "### Measured defense notes"; echo '```'; cat measured.log; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Build docs/dvp.js
        run: |
          python -m fantasy_football.cli dvp --out docs/dvp.js
          V=$(date -u +%Y%m%d%H%M)
          sed -i -E "s/(dvp\.js\?v=)[0-9]+/\1$V/" docs/index.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dvp.js docs/index.html defense_notes.csv
          git commit -m "DvP refresh $(date -u +%F)" || echo "no changes"
          # rebase-and-retry: another job or a PR merge may have moved main during the run
          pushed=0
          for i in 1 2 3 4; do
            if git pull --rebase origin main; then
              if git push; then pushed=1; break; fi
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git diff --name-only --diff-filter=U | xargs -r git checkout --theirs --
              git add -A && GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep $((i * 5))
          done
          [ "$pushed" = 1 ] || { echo "::error::push failed after 4 attempts"; exit 1; }
