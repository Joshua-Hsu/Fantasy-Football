<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>FF Tier Builder</title>
<style>
  /* ---- Design tokens (Robinhood-inspired: green accent, big type, soft cards) ---- */
  :root {
    color-scheme: light dark;
    --bg:#ffffff; --surface:#ffffff; --surface-2:#f5f6f8;
    --ink:#0b0c0e; --muted:#6b7280; --line:#e7e9ec;
    --accent:#00c805; --accent-ink:#009e22; --accent-soft:#e9faec;
    --down:#ff5000;
    --radius:18px; --radius-sm:12px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 20px rgba(16,24,40,.06);
    --shadow-press:0 0 0 3px var(--accent-soft);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000000; --surface:#0c0e0f; --surface-2:#15181a;
      --ink:#f4f6f7; --muted:#98a2ad; --line:#23272b;
      --accent:#00c805; --accent-ink:#27e068; --accent-soft:#0f2417;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.5);
      --shadow-press:0 0 0 3px var(--accent-soft);
    }
  }

  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
    margin:0; margin-inline:auto; max-width:860px;
    padding:0 1rem 3.5rem;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  a { color:var(--accent-ink); text-decoration:none; font-weight:600; }
  button { font:inherit; }

  /* ---- Header ---- */
  .nav {
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
    padding:.8rem 0; margin-bottom:.4rem;
    background:color-mix(in srgb, var(--bg) 85%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .nav .spacer { flex:1; }
  .brand {
    display:inline-flex; align-items:center; gap:.45rem;
    color:var(--ink); font-weight:800; font-size:1.02rem; letter-spacing:-.01em;
  }
  .brand .ball { font-size:1.15rem; }
  .pill {
    font-size:.78rem; font-weight:700; color:var(--muted);
    background:var(--surface-2); border:1px solid var(--line);
    padding:.32rem .72rem; border-radius:999px; white-space:nowrap;
  }

  /* ---- Type ---- */
  h1 { font-size:2.1rem; line-height:1.08; letter-spacing:-.025em; font-weight:800; margin:.7rem 0 .5rem; }
  p { line-height:1.5; }
  .lead { color:var(--muted); font-size:1.02rem; margin:0 0 1.4rem; max-width:48ch; }
  .muted { color:var(--muted); font-size:.9rem; }
  code { background:var(--surface-2); padding:.1rem .38rem; border-radius:6px; font-size:.85em; }

  /* ---- Position grid (home) ---- */
  .pos-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.8rem; }
  .pos-grid button {
    display:flex; flex-direction:column; align-items:flex-start; gap:.3rem;
    text-align:left; cursor:pointer;
    border:1px solid var(--line); border-radius:var(--radius);
    padding:1.15rem 1rem; background:var(--surface); color:var(--ink);
    box-shadow:var(--shadow);
    transition:border-color .12s, transform .08s, box-shadow .12s;
  }
  .pos-grid button:hover { border-color:var(--accent); }
  .pos-grid button:active { transform:scale(.98); }
  .pos-grid .pos { font-size:1.55rem; font-weight:800; letter-spacing:-.01em; color:var(--accent-ink); }
  .pos-grid .sub { font-size:.82rem; color:var(--muted); font-weight:500; }

  /* ---- Buttons ---- */
  .actions { display:flex; flex-wrap:wrap; gap:.6rem; margin:1.4rem 0 .7rem; }
  .btn {
    display:inline-flex; align-items:center; gap:.45rem;
    font-weight:600; cursor:pointer;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:999px; padding:.62rem 1.05rem;
    transition:border-color .12s, background .12s, transform .08s, filter .12s;
  }
  .btn:hover { border-color:var(--accent); }
  .btn:active { transform:scale(.98); }
  .btn-primary {
    background:var(--accent); border-color:var(--accent); color:#fff;
    box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 38%, transparent);
  }
  .btn-primary:hover { filter:brightness(1.04); border-color:var(--accent); }

  /* ---- Head-to-head cards (play) ---- */
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:.9rem; }
  .card {
    width:100%; text-align:left; cursor:pointer;
    border:1px solid var(--line); border-radius:var(--radius);
    padding:1.15rem; background:var(--surface); color:var(--ink);
    box-shadow:var(--shadow);
    transition:border-color .12s, transform .08s, box-shadow .12s;
  }
  .card:hover { border-color:var(--accent); }
  .card:active { border-color:var(--accent); transform:scale(.99); box-shadow:var(--shadow-press); }
  .card .name { font-size:1.22rem; font-weight:800; letter-spacing:-.01em; display:flex; align-items:center; gap:.4rem; margin-bottom:.1rem; }
  .row {
    display:flex; justify-content:space-between; gap:1rem;
    padding:.4rem 0; border-top:1px solid var(--line); font-size:.92rem;
  }
  .row span { color:var(--muted); }
  .row b { font-variant-numeric:tabular-nums; font-weight:700; }
  .card .muted + .row, .card .name + .muted { margin-top:.15rem; }
  .stats { margin-top:.55rem; }
  .vs { display:flex; justify-content:center; gap:.6rem; margin:1.1rem 0 2rem; }

  /* ---- Ranking table ---- */
  .table-wrap { border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:.92rem; }
  thead th { font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; background:var(--surface-2); }
  th,td { text-align:right; padding:.7rem .8rem; border-bottom:1px solid var(--line); }
  th:nth-child(2),td:nth-child(2){ text-align:left; }
  tbody tr:last-child td { border-bottom:0; }
  td:nth-child(2){ font-weight:600; }

  /* ---- Chips / badges ---- */
  .badge {
    font-size:.68rem; font-weight:800; letter-spacing:.02em;
    padding:.08rem .4rem; border-radius:6px;
    background:var(--accent-soft); color:var(--accent-ink); border:0;
  }
  .tier {
    display:inline-block; min-width:1.7rem; text-align:center;
    font-weight:800; font-size:.78rem; padding:.16rem .5rem; border-radius:999px;
    background:var(--accent-soft); color:var(--accent-ink);
  }

  @media (max-width:520px){
    .cards{ grid-template-columns:1fr; }
    h1{ font-size:1.8rem; }
  }

  /* ---- Duel screen: both cards fit the viewport, no scrolling ---- */
  body:has(.duel) { padding-bottom:0; }
  .duel {
    display:flex; flex-direction:column;
    height:100dvh; min-height:0; overflow:hidden;
  }
  .duel h1 { font-size:clamp(1.05rem, 4.2vh, 1.9rem); margin:.45rem 0 .45rem; }
  .duel .nav { position:static; }
  .duel .cards { flex:1; min-height:0; }
  .duel .card { min-height:0; overflow:hidden; }
  .duel .vs { margin:.6rem 0 .2rem; }
  .vals {
    display:flex; flex-wrap:nowrap; gap:.6rem; justify-content:space-between;
    overflow:hidden; margin-top:.5rem; padding-top:.45rem;
    border-top:1px solid var(--line);
  }
  .vals .seg b { font-size:1.05rem; }
  @media (max-width:520px){
    .duel .cards { grid-template-rows:minmax(0,1fr) minmax(0,1fr); }
  }
  /* Progressively condense on short screens so the cards always fit. */
  @media (max-height:760px){
    .duel .card { padding:.8rem .9rem; }
    .duel .card .name { font-size:1.05rem; margin-bottom:.05rem; }
    .duel .muted { font-size:.78rem; }
    .duel .vals { margin-top:.35rem; padding-top:.3rem; }
    .duel .vals .seg b { font-size:.95rem; }
    .duel .statline { margin-top:.35rem; padding-top:.3rem; }
  }
  @media (max-height:640px){
    .duel h1 { margin:.25rem 0; }
    .duel .card { padding:.55rem .7rem; }
    .duel .muted { font-size:.72rem; }
    .duel .vals .seg b { font-size:.85rem; }
    .duel .statline .seg b { font-size:.72rem; }
    .duel .seg i { font-size:.54rem; }
    .duel .btn { padding:.4rem .8rem; font-size:.85rem; }
  }

  /* ---- Commissioner tier editor ---- */
  .ad-list { border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  .ad-tier-head {
    background:var(--surface-2); padding:.5rem .9rem; cursor:pointer;
    font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    border-top:2px solid var(--line);
  }
  .ad-tier-head:first-child { border-top:0; }
  .ad-row {
    display:flex; align-items:center; gap:.5rem;
    padding:.5rem .9rem; border-top:1px solid var(--line);
    cursor:grab; background:var(--surface); font-size:.92rem;
  }
  .ad-row:active { cursor:grabbing; }
  .ad-row.ad-sel { outline:2px solid var(--accent); outline-offset:-2px; }
  .ad-row.ad-chg { background:var(--accent-soft); }
  .ad-dot { color:var(--accent-ink); margin-left:auto; font-size:.7rem; }

  /* ---- Levels & trophy case ---- */
  a.lv-pill { color:var(--accent-ink); }
  .lv-h2 { font-size:1.25rem; letter-spacing:-.01em; margin:1.6rem 0 .6rem; }
  .lv-grid, .tr-grid { display:grid; gap:.7rem; }
  .lv-grid { grid-template-columns:1fr; }
  .tr-grid { grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); }
  .lv-card {
    display:flex; align-items:center; gap:.9rem;
    border:1px solid var(--line); border-radius:var(--radius);
    padding:.8rem 1rem; background:var(--surface); box-shadow:var(--shadow);
  }
  .lv-emoji { font-size:2rem; line-height:1; }
  .lv-name { font-weight:800; letter-spacing:-.01em; }
  .lv-req { font-size:.78rem; }
  .lv-smack { font-size:.88rem; color:var(--muted); margin-top:.15rem; }
  .lv-cur { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow); }
  .lv-cur .lv-smack { color:var(--ink); }
  .lv-locked { opacity:.55; }
  .lv-done .lv-check { color:var(--accent-ink); font-weight:800; }
  .tr-card {
    text-align:center; border:1px solid var(--line); border-radius:var(--radius);
    padding:1rem .8rem; background:var(--surface); box-shadow:var(--shadow);
  }
  .tr-won { border-color:var(--accent); }
  .tr-locked { opacity:.5; }
  .tr-lock { font-size:2.2rem; display:block; margin-bottom:.3rem; }
  .tr-card svg { display:block; margin:0 auto .3rem; }
  .tr-card .tr-img {
    display:block; width:112px; height:112px; object-fit:contain;
    margin:0 auto .35rem; border-radius:14px;
  }

  /* ---- New-to-role coach highlight ---- */
  .coach-new {
    background:var(--accent-soft); color:var(--accent-ink);
    font-weight:600; padding:.04rem .3rem; border-radius:6px;
  }

  /* ---- Card stat strip + team-offense ranks ---- */
  .seg { white-space:nowrap; font-variant-numeric:tabular-nums; }
  .seg b { font-weight:700; font-size:.85rem; color:var(--ink); }
  .seg i {
    font-style:normal; color:var(--muted);
    font-size:.64rem; margin-left:.18rem;
    text-transform:uppercase; letter-spacing:.04em;
  }
  .seg.good b { color:var(--accent-ink); }
  .seg.bad b { color:var(--down); }
  .tm-rank {
    display:flex; flex-wrap:nowrap; gap:.7rem; align-items:baseline;
    overflow:hidden; margin-top:.2rem; font-size:.8rem;
  }
  .tm-rank .tm-lab {
    color:var(--muted); font-size:.64rem; font-weight:700;
    text-transform:uppercase; letter-spacing:.05em; white-space:nowrap;
  }
  .statline {
    display:flex; flex-wrap:nowrap; gap:.75rem; justify-content:space-between;
    overflow:hidden; margin-top:.55rem; padding-top:.45rem;
    border-top:1px solid var(--line);
  }
  @media (max-width:520px){
    .statline { gap:.45rem; }
    .statline .seg b, .tm-rank .seg b { font-size:.78rem; }
    .seg i { font-size:.58rem; }
  }

  /* ---- Tier notes (rank view) ---- */
  tr.tier-head td {
    background:var(--surface-2); text-align:left; padding:.45rem .8rem;
  }
  .note-input {
    font:inherit; font-size:.86rem; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:.3rem .55rem; width:min(34rem, 75%);
  }
  .note-input:focus { outline:none; border-color:var(--accent); }

  /* ---- Personal draft packet ---- */
  .packet h2 { font-size:1.3rem; letter-spacing:-.01em; margin:1.6rem 0 .5rem; }
  .pk-sec { margin-bottom:1rem; }
  table.pk { font-size:.82rem; }
  table.pk th, table.pk td { padding:.32rem .5rem; }
  table.pk td.note-col { text-align:left; max-width:15rem; font-size:.78rem; color:var(--muted); }
  table.pk th.note-col { text-align:left; }
  table.pk td.pk-name { text-align:left; font-weight:600; }
  table.pk td.bid { min-width:3rem; background:var(--surface-2); }
  tr.tier-gap td { border-bottom:2px solid var(--ink); padding:0; height:.4rem; background:var(--surface-2); }

  @media print {
    .nav, .no-print, .actions { display:none !important; }
    body { max-width:none; padding:0; background:#fff; color:#000; }
    .table-wrap { border:1px solid #999; box-shadow:none; border-radius:0; overflow:visible; }
    table.pk { font-size:8.5pt; }
    .packet h2 { break-before:page; page-break-before:always; margin-top:0; }
    .packet section:first-child h2 { break-before:auto; page-break-before:auto; }
    thead { display:table-header-group; }   /* repeat headers across pages */
    tr { break-inside:avoid; }
  }
</style>
</head>
