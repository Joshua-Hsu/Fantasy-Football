name = "ff-commit-worker"
main = "worker.js"
compatibility_date = "2024-11-01"

# Non-secret config. Edit these for your setup.
[vars]
GH_REPO = "Joshua-Hsu/Fantasy-Football"
GH_BRANCH = "main"
# Your GitHub Pages origin (no trailing slash). Use "*" to allow any origin.
ALLOWED_ORIGIN = "https://joshua-hsu.github.io"

# Per-IP rate limit: 20 commits/minute is generous for humans, hostile to bots.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secrets - do not put them here. Set with `npx wrangler secret put NAME`
# (or dashboard Settings -> Variables and Secrets):
#   GH_TOKEN          required; fine-grained PAT (Contents RW on the repo)
#   TURNSTILE_SECRET  optional; enables the Turnstile bot check
#   LEAGUE_CODE       optional; private-league passcode (unset = public mode)
