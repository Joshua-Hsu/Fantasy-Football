[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-football"
version = "0.1.0"
description = "A football statistics database, modeled on sites like Pro Football Reference."
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Ingestion pulls nflverse files directly via pandas (parquet needs pyarrow).
ingest = ["pandas>=2.0", "pyarrow>=14"]

[project.scripts]
fantasy-football = "fantasy_football.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
