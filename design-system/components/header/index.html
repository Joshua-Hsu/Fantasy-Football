<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header</title>
<style>
  :root{color-scheme:light dark;
    --bg:#fff;--surface:#fff;--surface-2:#f5f6f8;--ink:#0b0c0e;--muted:#6b7280;--line:#e7e9ec;
    --accent:#00c805;--accent-ink:#009e22;}
  @media (prefers-color-scheme:dark){:root{
    --bg:#000;--surface:#0c0e0f;--surface-2:#15181a;--ink:#f4f6f7;--muted:#98a2ad;--line:#23272b;
    --accent:#00c805;--accent-ink:#27e068;}}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;margin:0;padding:28px;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 14px}
  .frame{max-width:420px;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
  .nav{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(180%) blur(12px)}
  .nav .spacer{flex:1}
  .brand{display:inline-flex;align-items:center;gap:.45rem;color:var(--ink);font-weight:800;font-size:1.02rem;letter-spacing:-.01em}
  .brand .ball{font-size:1.15rem}
  .nav a{color:var(--accent-ink);font-weight:600;text-decoration:none}
  .sep{color:var(--muted)}
  .pill{font-size:.78rem;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:.32rem .72rem;border-radius:999px}
  .body{padding:1rem;color:var(--muted);font-size:.85rem}
</style></head>
<body>
  <h2>Sticky header — home</h2>
  <div class="frame">
    <div class="nav"><a class="brand" href="#"><span class="ball">🏈</span> Tier Builder</a><span class="spacer"></span><span class="pill">0 picks</span></div>
    <div class="body">Blurred, sticky, hairline bottom border. Brand doubles as the home link.</div>
  </div>

  <h2>Sticky header — sub-view with breadcrumb</h2>
  <div class="frame">
    <div class="nav"><a class="brand" href="#"><span class="ball">🏈</span> Tier Builder</a><span class="sep">·</span><a href="#">QB ranking</a><span class="spacer"></span><span class="pill">9 picks</span></div>
    <div class="body">Secondary link in <code>--accent-ink</code>; running pick count as a muted pill on the right.</div>
  </div>
</body></html>
