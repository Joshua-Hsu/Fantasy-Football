<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking table</title>
<style>
  :root{color-scheme:light dark;
    --bg:#fff;--surface:#fff;--surface-2:#f5f6f8;--ink:#0b0c0e;--muted:#6b7280;--line:#e7e9ec;
    --accent:#00c805;--accent-ink:#009e22;--accent-soft:#e9faec;--radius:18px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 20px rgba(16,24,40,.06);}
  @media (prefers-color-scheme:dark){:root{
    --bg:#000;--surface:#0c0e0f;--surface-2:#15181a;--ink:#f4f6f7;--muted:#98a2ad;--line:#23272b;
    --accent:#00c805;--accent-ink:#27e068;--accent-soft:#0f2417;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5);}}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;margin:0;padding:28px;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 14px}
  .table-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);max-width:560px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
  thead th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surface-2)}
  th,td{text-align:right;padding:.7rem .8rem;border-bottom:1px solid var(--line)}
  th:nth-child(2),td:nth-child(2){text-align:left}
  tbody tr:last-child td{border-bottom:0}
  td:nth-child(2){font-weight:600}
  .badge{font-size:.68rem;font-weight:800;padding:.08rem .4rem;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink)}
  .tier{display:inline-block;min-width:1.7rem;text-align:center;font-weight:800;font-size:.78rem;padding:.16rem .5rem;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
</style></head>
<body>
  <h2>QB ranking</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>#</th><th>Player</th><th>Tm</th><th>Rating</th><th>Tier</th><th>Picks</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>Josh Allen</td><td>BUF</td><td>381</td><td><span class="tier">1</span></td><td>6</td></tr>
      <tr><td>2</td><td>Lamar Jackson</td><td>BAL</td><td>372</td><td><span class="tier">1</span></td><td>5</td></tr>
      <tr><td>3</td><td>Jayden Daniels</td><td>WAS</td><td>344</td><td><span class="tier">2</span></td><td>4</td></tr>
      <tr><td>4</td><td>Ashton Jeanty <span class="badge">R</span></td><td>LV</td><td>331</td><td><span class="tier">2</span></td><td>3</td></tr>
      <tr><td>5</td><td>Jalen Hurts</td><td>PHI</td><td>318</td><td><span class="tier">3</span></td><td>4</td></tr>
    </tbody>
  </table></div>
</body></html>
