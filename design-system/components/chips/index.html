<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chips & badges</title>
<style>
  :root{color-scheme:light dark;
    --bg:#fff;--surface:#fff;--surface-2:#f5f6f8;--ink:#0b0c0e;--muted:#6b7280;--line:#e7e9ec;
    --accent:#00c805;--accent-ink:#009e22;--accent-soft:#e9faec;}
  @media (prefers-color-scheme:dark){:root{
    --bg:#000;--surface:#0c0e0f;--surface-2:#15181a;--ink:#f4f6f7;--muted:#98a2ad;--line:#23272b;
    --accent:#00c805;--accent-ink:#27e068;--accent-soft:#0f2417;}}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;margin:0;padding:28px;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 14px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:24px}
  .tier{display:inline-block;min-width:1.7rem;text-align:center;font-weight:800;font-size:.78rem;padding:.16rem .5rem;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .badge{font-size:.68rem;font-weight:800;letter-spacing:.02em;padding:.08rem .4rem;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);border:0}
  .pill{font-size:.78rem;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:.32rem .72rem;border-radius:999px}
</style></head>
<body>
  <h2>Tier chip — ranking table</h2>
  <div class="row">
    <span class="tier">1</span><span class="tier">2</span><span class="tier">3</span><span class="tier">7</span>
  </div>

  <h2>Rookie badge — inline with name</h2>
  <div class="row">
    <span style="font-weight:800">Ashton Jeanty <span class="badge">R</span></span>
  </div>

  <h2>Count pill — header</h2>
  <div class="row">
    <span class="pill">9 picks</span>
    <span class="pill">0 picks</span>
  </div>
</body></html>
